<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bad Gateway | Scan-PDF</title>
    <meta name="theme-color" content="#7c3aed">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                        display: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f5f3ff', 100: '#ede9fe', 200: '#ddd6fe', 300: '#c4b5fd', 400: '#a78bfa',
                            500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9', 800: '#5b21b6', 900: '#4c1d95', 950: '#2e1065',
                        },
                        surface: {
                            50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1', 400: '#94a3b8',
                            500: '#64748b', 600: '#475569', 700: '#334155', 800: '#1e293b', 900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-surface-50 text-surface-900 antialiased selection:bg-brand-500 selection:text-white min-h-screen flex flex-col">
    <header class="w-full bg-white border-b border-surface-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-[70px] flex items-center justify-between">
            <a href="/" class="flex items-center gap-2">
                <div class="w-8 h-8 bg-brand-600 rounded-lg flex items-center justify-center">
                    <i data-lucide="scan" class="w-5 h-5 text-white"></i>
                </div>
                <span class="font-black text-xl tracking-tight text-surface-900">Scan<span class="text-brand-600">PDF</span></span>
            </a>
        </div>
    </header>

    <main class="flex-grow flex flex-col">
        <section class="min-h-[calc(100vh-150px)] flex-1 flex items-center justify-center relative overflow-hidden px-4 py-12 w-full">
            <div class="absolute inset-0 bg-gradient-to-b from-surface-50 via-white to-surface-50 -z-10"></div>
            <div class="absolute top-1/4 left-[10%] w-[300px] h-[300px] bg-brand-100/20 rounded-full blur-[100px] -z-10 motion-safe:animate-[pulse_4s_cubic-bezier(0.4,0,0.6,1)_infinite]"></div>
            <div class="absolute bottom-1/4 right-[10%] w-[250px] h-[250px] bg-purple-100/20 rounded-full blur-[100px] -z-10 motion-safe:animate-[pulse_4s_cubic-bezier(0.4,0,0.6,1)_infinite]" style="animation-delay: 2s;"></div>

            <div class="max-w-xl w-full text-center relative z-10 motion-safe:animate-[fade-in-up_0.6s_ease-out]">
                <div class="relative mb-8 group">
                    <h1 class="text-[120px] sm:text-[180px] font-black leading-none bg-gradient-to-br from-brand-600 to-brand-100 bg-clip-text text-transparent opacity-20 select-none transition-transform duration-700 motion-safe:group-hover:scale-105">
                        502
                    </h1>
                    <div class="absolute inset-0 flex items-center justify-center">
                        <div class="w-24 h-24 rounded-[2rem] bg-gradient-to-br from-brand-600 to-brand-700 flex items-center justify-center shadow-2xl shadow-brand-500/30 motion-safe:animate-[float_6s_ease-in-out_infinite] transition-transform duration-500 motion-safe:group-hover:rotate-6">
                            <i data-lucide="server-off" class="w-12 h-12 text-white"></i>
                        </div>
                    </div>
                </div>

                <h2 class="text-3xl sm:text-4xl font-black text-surface-900 mb-4 tracking-tight">
                    Bad Gateway
                </h2>
                <p class="text-surface-500 text-base sm:text-lg mb-10 leading-relaxed font-light px-4 motion-safe:animate-[fade-in_0.8s_ease-out_0.2s_both]">
                    The server received an invalid response from the upstream server. We'll be back shortly.
                </p>

                <div class="flex flex-col sm:flex-row items-center justify-center gap-4 px-6 motion-safe:animate-[fade-in_0.8s_ease-out_0.4s_both]">
                    <a href="javascript:location.reload()" class="w-full sm:w-auto inline-flex items-center justify-center gap-2.5 px-8 py-4 rounded-2xl bg-gradient-to-r from-brand-600 to-brand-700 text-white font-black text-sm hover:from-brand-500 hover:to-brand-600 transition-all shadow-xl shadow-brand-500/20 hover:-translate-y-1 active:scale-95">
                        <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                        Refresh Page
                    </a>
                </div>
            </div>
        </section>
    </main>

    <footer class="w-full py-8 text-center border-t border-surface-200">
        <p class="text-surface-500 text-sm">© ScanPDF. All rights reserved.</p>
    </footer>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
