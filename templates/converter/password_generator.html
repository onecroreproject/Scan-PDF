{% extends 'converter/tool_base.html' %}
{% load static %}

{% block tool_content %}

<style>

/* =========================================================
   PAGE HEADING
   ========================================================= */

.tool-heading {
    font-size: 3.5rem;
    line-height: 0.95;
    font-weight: 900;
    letter-spacing: -0.04em;
}

.gradient-text {
    background: linear-gradient(
        135deg,
        #7c3aed,
        #a855f7,
        #ec4899
    );
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}


/* =========================================================
   PURPLE BUTTON
   ========================================================= */

.purple-btn {
    background: linear-gradient(
        135deg,
        #6d28d9 0%,
        #7c3aed 45%,
        #a855f7 100%
    );
    color: white;
    box-shadow: 0 8px 25px rgba(124, 58, 237, 0.25);
    transition: all 0.25s ease;
}

.purple-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(124, 58, 237, 0.38);
}

.purple-btn:active {
    transform: translateY(0);
}

.purple-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 768px) {
    .tool-heading { font-size: 3rem; }
}

@media (max-width: 480px) {
    .tool-heading { font-size: 2.6rem; }
}

</style>


<!-- =========================================================
     PAGE HEADER
     ========================================================= -->

<section class="text-center mb-8 sm:mb-10">

    <h1 class="tool-heading text-surface-900 mb-3">
        <span class="block">{{ s1 }}</span>
        <span class="block gradient-text">{{ highlight }}</span>
    </h1>

    <p class="max-w-3xl mx-auto text-sm sm:text-base lg:text-lg text-surface-500 leading-relaxed">
        {{ seo_intro }}
    </p>

    {% if seo_keywords %}
    <p class="max-w-3xl mx-auto mt-2 text-xs sm:text-sm text-surface-400 leading-relaxed">
        {{ seo_keywords }}
    </p>
    {% endif %}

</section>


<!-- =========================================================
     MAIN CARD
     ========================================================= -->

<div class="rounded-2xl bg-[#faf5ff] p-4 sm:p-6">

    <!-- Password Display -->
    <div class="relative mb-6">
        <div class="p-6 sm:p-8 rounded-2xl bg-white border border-violet-100 text-center">
            <div class="absolute top-3 right-3">
                <button id="copy-btn"
                    class="p-2.5 rounded-xl bg-violet-50 border border-violet-100 text-violet-600 hover:bg-violet-100 transition-all flex items-center gap-2 text-[10px] font-black uppercase tracking-wider">
                    <i data-lucide="copy" class="w-4 h-4"></i>
                    Copy
                </button>
            </div>
            <h4 class="text-[10px] font-black text-surface-400 uppercase tracking-[0.2em] mb-4">
                Secure Password
            </h4>
            <div id="password-display"
                class="text-2xl sm:text-3xl md:text-4xl font-mono font-black text-surface-900 break-all select-all tracking-wider">
                ********
            </div>
        </div>
    </div>


    <!-- Length Slider -->
    <div class="mb-6">
        <div class="flex items-center justify-between px-1 mb-3">
            <label class="text-xs font-black text-surface-400 uppercase tracking-widest">
                Password Length
            </label>
            <span id="length-val"
                class="px-3 py-1 rounded-lg bg-violet-50 text-violet-700 text-sm font-black font-mono border border-violet-100">
                16
            </span>
        </div>
        <input type="range" id="length-range" min="8" max="64" value="16"
            class="w-full h-2 bg-violet-100 rounded-lg appearance-none cursor-pointer accent-violet-600">
        <div class="flex justify-between mt-2 text-[10px] font-bold text-surface-400 uppercase tracking-tighter">
            <span>Min (8)</span>
            <span>Max (64)</span>
        </div>
    </div>


    <!-- Options -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">

        <label class="flex items-center gap-4 p-4 rounded-xl border border-violet-100 bg-white cursor-pointer hover:border-violet-400 transition-all group">
            <input type="checkbox" id="upper-check" checked
                class="w-5 h-5 rounded-md border-surface-300 text-violet-600 focus:ring-violet-500">
            <div class="min-w-0">
                <p class="text-sm font-bold text-surface-700 group-hover:text-violet-600">Uppercase Letters</p>
                <p class="text-[10px] text-surface-400 font-medium">Include A-Z</p>
            </div>
        </label>

        <label class="flex items-center gap-4 p-4 rounded-xl border border-violet-100 bg-white cursor-pointer hover:border-violet-400 transition-all group">
            <input type="checkbox" id="num-check" checked
                class="w-5 h-5 rounded-md border-surface-300 text-violet-600 focus:ring-violet-500">
            <div class="min-w-0">
                <p class="text-sm font-bold text-surface-700 group-hover:text-violet-600">Numbers</p>
                <p class="text-[10px] text-surface-400 font-medium">Include 0-9</p>
            </div>
        </label>

        <label class="flex items-center gap-4 p-4 rounded-xl border border-violet-100 bg-white cursor-pointer hover:border-violet-400 transition-all group">
            <input type="checkbox" id="sym-check" checked
                class="w-5 h-5 rounded-md border-surface-300 text-violet-600 focus:ring-violet-500">
            <div class="min-w-0">
                <p class="text-sm font-bold text-surface-700 group-hover:text-violet-600">Symbols</p>
                <p class="text-[10px] text-surface-400 font-medium">Include !@#$%^&*</p>
            </div>
        </label>

        <label class="flex items-center gap-4 p-4 rounded-xl border border-violet-100 bg-white cursor-pointer opacity-70">
            <input type="checkbox" id="lower-check" checked disabled
                class="w-5 h-5 rounded-md border-surface-300 text-violet-600">
            <div class="min-w-0">
                <p class="text-sm font-bold text-surface-700">Lowercase Letters</p>
                <p class="text-[10px] text-surface-400 font-medium">Always Included (a-z)</p>
            </div>
        </label>

    </div>


    <!-- Generate Button -->
    <div class="text-center">
        <button id="generate-btn"
            class="purple-btn w-auto mx-auto px-8 py-3 sm:py-4 rounded-2xl text-white font-black text-sm sm:text-base uppercase tracking-widest flex items-center justify-center gap-3">
            <i data-lucide="refresh-cw" class="w-5 h-5"></i>
            Generate Password
        </button>
    </div>

</div>

{% endblock %}


{% block extra_scripts %}
<script>
const CONVERT_URL = '{% url "converter:convert_file" "password-generator" %}';
const CSRF_TOKEN = '{{ csrf_token }}';

const generateBtn = document.getElementById('generate-btn');
const passwordDisplay = document.getElementById('password-display');
const lengthRange = document.getElementById('length-range');
const lengthVal = document.getElementById('length-val');
const upperCheck = document.getElementById('upper-check');
const numCheck = document.getElementById('num-check');
const symCheck = document.getElementById('sym-check');
const copyBtn = document.getElementById('copy-btn');

lengthRange.addEventListener('input', () => {
    lengthVal.innerText = lengthRange.value;
});

const generate = async () => {
    generateBtn.disabled = true;
    const originalHTML = generateBtn.innerHTML;
    generateBtn.innerHTML = '<div class="w-5 h-5 rounded-full border-2 border-white border-t-transparent animate-spin"></div> Generating…';

    try {
        const formData = new FormData();
        formData.append('length', lengthRange.value);
        formData.append('use_upper', upperCheck.checked);
        formData.append('use_nums', numCheck.checked);
        formData.append('use_syms', symCheck.checked);
        formData.append('csrfmiddlewaretoken', CSRF_TOKEN);

        const response = await fetch(CONVERT_URL, {
            method: 'POST',
            body: formData
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || 'Failed to generate password');
        }

        passwordDisplay.innerText = data.result;
    } catch (err) {
        alert(err.message);
    } finally {
        generateBtn.disabled = false;
        generateBtn.innerHTML = originalHTML;
        if (typeof lucide !== 'undefined') lucide.createIcons();
    }
};

generateBtn.addEventListener('click', generate);

copyBtn.addEventListener('click', () => {
    if (passwordDisplay.innerText === '********') return;

    navigator.clipboard.writeText(passwordDisplay.innerText);

    const original = copyBtn.innerHTML;
    copyBtn.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i> Copied!';
    if (typeof lucide !== 'undefined') lucide.createIcons();

    setTimeout(() => {
        copyBtn.innerHTML = original;
        if (typeof lucide !== 'undefined') lucide.createIcons();
    }, 2000);
});

// Auto-generate on load
window.addEventListener('DOMContentLoaded', generate);

if (typeof lucide !== 'undefined') lucide.createIcons();
</script>
{% endblock %}
