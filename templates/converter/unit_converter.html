{% extends 'converter/tool_base.html' %}
{% load static %}

{% block tool_content %}
<div class="uc-app rounded-2xl bg-white border border-surface-100 p-4 sm:p-6 shadow-mega">
    <div class="uc-hero mb-5">
        <h2 class="text-xl sm:text-2xl font-black text-surface-900">Privacy-First Multi Converter</h2>
    </div>

    <div class="uc-layout">
        <aside class="uc-sidebar" id="uc-sidebar"></aside>

        <section class="uc-panel">
            <div class="uc-header">
                <div>
                    <h3 id="uc-title" class="text-lg font-extrabold text-surface-900">Length / Distance</h3>
                    <p id="uc-subtitle" class="text-xs text-surface-500 mt-0.5">Base-unit conversion with real-time updates.</p>
                </div>
                <div class="uc-badge" id="currency-status" hidden>Static rates</div>
            </div>

            <div id="uc-error" class="uc-error" hidden></div>

            <div id="uc-standard-grid" class="uc-grid">
                <div class="uc-field">
                    <label for="uc-input">Input value</label>
                    <input id="uc-input" type="number" step="any" placeholder="Enter value">
                </div>
                <div class="uc-field">
                    <label for="uc-from">From unit</label>
                    <select id="uc-from"></select>
                </div>
                <div class="uc-field">
                    <label for="uc-to">To unit</label>
                    <select id="uc-to"></select>
                </div>
            </div>

            <div id="uc-timezone-grid" class="uc-grid" hidden>
                <div class="uc-field">
                    <label for="tz-datetime">Date and time</label>
                    <input id="tz-datetime" type="datetime-local">
                </div>
                <div class="uc-field">
                    <label for="tz-from">From timezone</label>
                    <select id="tz-from"></select>
                </div>
                <div class="uc-field">
                    <label for="tz-to">To timezone</label>
                    <select id="tz-to"></select>
                </div>
            </div>

            <div class="uc-actions">
                <button id="uc-swap" class="uc-btn uc-btn-soft" type="button">Swap Units</button>
                <button id="uc-reset" class="uc-btn uc-btn-soft" type="button">Reset</button>
                <button id="uc-convert" class="uc-btn uc-btn-primary" type="button">Convert</button>
            </div>

            <div class="uc-result-wrap">
                <p class="uc-result-label">Result</p>
                <div id="uc-result" class="uc-result">-</div>
                <p id="uc-meta" class="uc-meta"></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block tool_head %}
<link rel="stylesheet" href="{% static 'css/unit_converter.css' %}">
{% endblock %}

{% block tool_scripts %}
<script src="{% static 'js/unit_converter.js' %}"></script>
{% endblock %}
