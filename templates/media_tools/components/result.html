<!-- ==========================================================================
     SUCCESSFUL RESULT & DIRECT DOWNLOAD COMPONENT
     ========================================================================== -->
<div class="mt-result-card" id="mtResultCard">
    <div class="mt-result-badge">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
    </div>
    <div class="mt-result-title">Export Complete!</div>
    <p class="mt-subtitle" style="margin-bottom: 1rem;">
        Your video has been rendered and is ready to preview and download.
    </p>

    <!-- Result Preview Player -->
    <video class="mt-result-preview-video" id="mtResultVideo" controls playsinline preload="metadata">
        {% if output_url %}
        <source src="{{ output_url }}" type="video/mp4">
        {% endif %}
    </video>

    <div style="margin-top: 1.5rem; display: flex; align-items: center; justify-content: center; gap: 1rem; flex-wrap: wrap;">
        <a href="{% if output_url %}{{ output_url }}{% else %}#{% endif %}" class="mt-download-btn" id="mtDownloadBtn" download>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Download Video
        </a>
        <button type="button" class="mt-change-file-btn" onclick="window.location.reload();" style="padding: 0.85rem 1.4rem; font-size: 0.9rem;">
            Edit Another Video
        </button>
    </div>
</div>
