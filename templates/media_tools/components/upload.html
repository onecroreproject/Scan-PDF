{% load static %}

<!-- ==========================================================================
     MEDIA TOOLS — COMMON VIDEO UPLOAD CARD
     Used by all video editing templates.
     ========================================================================== -->

<div class="mt-upload-card" id="mtUploadCard">

    <div class="mt-upload-dropzone" id="mtUploadDropzone">

        <!-- Upload Icon -->
        <div class="mt-upload-icon-circle">
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="32"
                 height="32"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2.5"
                 stroke-linecap="round"
                 stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
        </div>

        <!-- Upload Button -->
        <button
            type="button"
            class="mt-upload-btn"
            id="mtUploadTriggerBtn">

            <svg xmlns="http://www.w3.org/2000/svg"
                 width="20"
                 height="20"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2.5"
                 stroke-linecap="round"
                 stroke-linejoin="round">
                <polygon points="23 7 16 12 23 17 23 7"></polygon>
                <rect x="1"
                      y="5"
                      width="15"
                      height="14"
                      rx="2"
                      ry="2"></rect>
            </svg>

            Choose Video File
        </button>

        <div class="mt-upload-hints">
            Or drag &amp; drop video file here
            &bull;
            Supports MP4, MOV, WEBM, AVI, MKV up to 500MB
        </div>

    </div>


    <!-- ======================================================================
         SELECTED FILE
         ====================================================================== -->

    <div
        class="mt-selected-file-chip"
        id="mtSelectedFileChip"
        style="display: none;">

        <div class="mt-file-info-group">

            <svg xmlns="http://www.w3.org/2000/svg"
                 width="28"
                 height="28"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="#7c3aed"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round">

                <path d="m10 15 5-3-5-3v6Z"></path>

                <rect
                    width="18"
                    height="18"
                    x="3"
                    y="3"
                    rx="2">
                </rect>

            </svg>

            <div>

                <div
                    class="mt-file-name"
                    id="mtFileName">
                    video.mp4
                </div>

                <div
                    class="mt-file-meta"
                    id="mtFileMeta">
                    0 MB
                </div>

            </div>

        </div>


        <!-- Remove -->
        <button
            type="button"
            class="mt-remove-btn"
            id="mtRemoveBtn"
            title="Remove file">

            <svg xmlns="http://www.w3.org/2000/svg"
                 width="18"
                 height="18"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2.5"
                 stroke-linecap="round"
                 stroke-linejoin="round">

                <line x1="18"
                      y1="6"
                      x2="6"
                      y2="18">
                </line>

                <line x1="6"
                      y1="6"
                      x2="18"
                      y2="18">
                </line>

            </svg>

        </button>

    </div>

</div>
