{% load static %}
<style>
    .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #cbd5e1;
        border-radius: 20px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background-color: #94a3b8;
    }
</style>

<!-- Loading State -->
<div id="loading-state" class="hidden flex flex-col items-center justify-center py-12">
    <div class="w-12 h-12 rounded-full border-4 border-brand-100 border-t-brand-600 animate-spin mb-4"></div>
    <h3 class="text-lg font-bold text-surface-800" id="loading-text">Analyzing media...</h3>
    <p class="text-sm text-surface-500 mt-1">This might take a few seconds.</p>
</div>

<!-- Error State -->
<div id="error-state" class="hidden py-8 text-center">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-red-50 text-red-500 mb-4">
        <i data-lucide="alert-circle" class="w-8 h-8"></i>
    </div>
    <h3 class="text-xl font-bold text-surface-900 mb-2">Oops, something went wrong</h3>
    <p id="error-message" class="text-surface-600 max-w-md mx-auto mb-6">Unable to process this URL.</p>
    <button onclick="resetUI()" class="px-6 py-2 bg-surface-100 hover:bg-surface-200 text-surface-800 font-bold rounded-xl transition-colors">
        Try Again
    </button>
</div>

<!-- Results State -->
<div id="results-state" class="hidden mt-8 border-t border-surface-100 pt-8 relative">

    <!-- Inline Error Toast -->
    <div id="inline-error" class="hidden absolute -top-4 left-1/2 transform -translate-x-1/2 w-11/12 sm:w-auto max-w-lg p-3 bg-red-600 text-white text-sm font-bold rounded-xl z-[150] shadow-xl flex flex-col sm:flex-row items-center gap-3 transition-opacity">
        <div class="flex items-center gap-2">
            <i data-lucide="alert-triangle" class="w-5 h-5 shrink-0"></i>
            <span id="inline-error-text" class="text-center sm:text-left">Download failed</span>
        </div>
        <button onclick="document.getElementById('inline-error').classList.add('hidden')" class="p-1 hover:bg-red-700 rounded-lg transition-colors">
            <i data-lucide="x" class="w-4 h-4"></i>
        </button>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-surface-200 max-w-2xl mx-auto flex flex-col relative z-0">
        
        <!-- Media Preview Box -->
        <div class="relative w-full aspect-video bg-surface-900 rounded-t-2xl">
            <!-- The clipped image layer -->
            <div class="absolute inset-0 overflow-hidden rounded-t-2xl pointer-events-none">
                <img id="media-thumbnail" src="" alt="Thumbnail" class="w-full h-full object-cover opacity-90 transition-opacity">
            </div>
            
            <!-- Platform Label Top Left -->
            <div class="absolute top-4 left-4 bg-black/60 backdrop-blur-md border border-white/10 text-white text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 z-10 shadow-sm pointer-events-auto">
                <i data-lucide="video" class="w-3.5 h-3.5" id="media-type-icon"></i>
                <span id="media-platform" class="uppercase tracking-wide">PLATFORM</span>
            </div>

            <!-- Action Controls Top Right -->
            <div class="absolute top-4 right-4 flex items-start gap-2 z-20 pointer-events-auto">
                
                <!-- Video Control -->
                <div id="video-control-container" class="relative hidden">
                    <button id="video-toggle-btn" onclick="toggleDropdown('video')" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white text-sm font-bold rounded-xl transition-all shadow-md flex items-center gap-2 backdrop-blur-sm z-10 relative">
                        <i data-lucide="video" class="w-4 h-4"></i>
                        <span class="hidden sm:inline">Video</span>
                        <i data-lucide="chevron-down" class="w-4 h-4 transition-transform duration-200" id="video-chevron"></i>
                    </button>
                    <!-- Floating Dropdown -->
                    <div id="video-dropdown" class="absolute right-0 top-full mt-2 w-[calc(100vw-32px)] sm:w-72 max-w-[288px] bg-white rounded-xl shadow-xl border border-surface-200 overflow-hidden hidden" style="z-index: 100;">
                        <!-- Scrollable List -->
                        <div id="video-formats-list" class="flex flex-col max-h-64 overflow-y-auto overscroll-contain custom-scrollbar py-1">
                            <!-- Populated dynamically -->
                        </div>
                    </div>
                </div>

                <!-- MP3 Control -->
                <div id="audio-control-container" class="relative hidden">
                    <button id="audio-toggle-btn" onclick="toggleDropdown('audio')" class="px-4 py-2 bg-black/60 hover:bg-black/80 text-white text-sm font-bold rounded-xl border border-white/10 transition-all shadow-md flex items-center gap-2 backdrop-blur-sm z-10 relative">
                        <i data-lucide="music" class="w-4 h-4"></i>
                        <span class="hidden sm:inline">MP3</span>
                        <i data-lucide="chevron-down" class="w-4 h-4 transition-transform duration-200" id="audio-chevron"></i>
                    </button>
                    <!-- Floating Dropdown -->
                    <div id="audio-dropdown" class="absolute right-0 top-full mt-2 w-[calc(100vw-32px)] sm:w-64 max-w-[256px] bg-white rounded-xl shadow-xl border border-surface-200 overflow-hidden hidden" style="z-index: 100;">
                        <!-- Scrollable List -->
                        <div id="audio-formats-list" class="flex flex-col max-h-64 overflow-y-auto overscroll-contain custom-scrollbar py-1">
                            <!-- Populated dynamically -->
                        </div>
                    </div>
                </div>

            </div>
        </div>
        
        <!-- Metadata Below Preview -->
        <div class="p-6 relative z-10 bg-white rounded-b-2xl">
            <h2 id="media-title" class="font-black text-xl text-surface-900 mb-2 line-clamp-2">Media Title</h2>
            <div class="flex flex-wrap items-center gap-3 text-sm text-surface-500 font-medium">
                <span id="media-author" class="text-brand-600 font-bold">@author</span>
                <span id="media-duration" class="text-surface-400"></span>
            </div>

            <!-- Image Results (For Carousels/Image posts) -->
            <div id="image-control-container" class="hidden mt-6 w-full pt-4 border-t border-surface-100">
                <h3 class="font-bold text-surface-900 text-sm uppercase tracking-wider mb-3" id="image-header">Images</h3>
                <div id="image-formats-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </div>
    </div>
    
    <div class="mt-8 text-center">
        <button onclick="resetUI()" class="text-sm font-bold text-brand-600 hover:text-brand-700 underline">
            Download another media
        </button>
    </div>
</div>
