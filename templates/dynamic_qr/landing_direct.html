<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ qr.qr_name }} — Direct View</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background: #ffffff; color: #000000; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .content-viewer { max-width: 800px; width: 100%; text-align: center; }
        .text-body { font-size: 32px; font-weight: 700; line-height: 1.4; white-space: pre-wrap; word-break: break-word; color: #000000; }
        @media (prefers-color-scheme: dark) {
            body { background: #000000; color: #ffffff; }
            .text-body { color: #ffffff; }
        }
    </style>
</head>
<body>
    <div class="content-viewer">
        <div class="text-body">{{ qr.qr_data.text }}</div>
    </div>
</body>
</html>
