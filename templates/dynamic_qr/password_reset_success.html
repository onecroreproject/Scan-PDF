{% extends 'dynamic_qr/auth_base.html' %}

{% block title %}Password Reset Success{% endblock %}

{% block auth_header %}
    <div style="width:64px;height:64px;background:linear-gradient(135deg,#22c55e,#16a34a);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:0 12px 40px rgba(34,197,94,0.3);">
        <i data-lucide="check" style="width:32px;height:32px;color:white;stroke-width:3"></i>
    </div>
    <h1>Reset Successful!</h1>
    <p>Password updated correctly.</p>
{% endblock %}

{% block auth_content %}
    <div style="text-align:center; padding: 10px 0;">
        <p style="color:rgba(255,255,255,0.45);font-size:13px;margin-bottom:24px;">You can now sign in with your new password.</p>
        <a href="{% url 'dynamic_qr:login' %}" class="btn-primary" style="text-decoration:none;background:linear-gradient(135deg,#22c55e,#16a34a); display:flex; align-items:center; justify-content:center; gap:8px;">
            <i data-lucide="log-in" style="width:18px;height:18px"></i>
            Sign In Now
        </a>
    </div>
{% endblock %}
