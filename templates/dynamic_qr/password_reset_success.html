{% extends 'dynamic_qr/auth_base.html' %}

{% block title %}Password Reset Success{% endblock %}

{% block body %}
<div class="auth-card" style="text-align:center;">
    <div style="width:80px;height:80px;background:linear-gradient(135deg,#22c55e,#16a34a);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:24px;box-shadow:0 12px 40px rgba(34,197,94,0.4);">
        <i data-lucide="check" style="width:40px;height:40px;color:white;stroke-width:3"></i>
    </div>
    <h1 style="font-size:22px;font-weight:900;color:white;margin-bottom:8px;">Password Reset Successfully!</h1>
    <p style="color:rgba(255,255,255,0.45);font-size:14px;margin-bottom:32px;">Your password has been updated. You can now sign in with your new password.</p>
    <a href="{% url 'dynamic_qr:login' %}" class="btn-primary" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;background:linear-gradient(135deg,#22c55e,#16a34a);">
        <i data-lucide="log-in" style="width:18px;height:18px"></i>
        Sign In Now
    </a>
</div>
{% endblock %}
