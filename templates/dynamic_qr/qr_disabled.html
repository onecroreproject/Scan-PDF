{% extends 'dynamic_qr/auth_base.html' %}

{% block title %}QR Code Disabled{% endblock %}

{% block body %}
<div class="auth-card" style="text-align:center;">
    <div style="width:80px;height:80px;background:linear-gradient(135deg,#ef4444,#dc2626);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:24px;box-shadow:0 12px 40px rgba(239,68,68,0.4);">
        <i data-lucide="qr-code" style="width:40px;height:40px;color:white;stroke-width:2"></i>
    </div>
    <h1 style="font-size:22px;font-weight:900;color:white;margin-bottom:8px;">QR Code is not active.</h1>
    <p style="color:rgba(255,255,255,0.45);font-size:14px;margin-bottom:32px;">This QR code has been deactivated by its owner.</p>
    <a href="/" class="btn-primary" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;">
        <i data-lucide="home" style="width:18px;height:18px"></i>
        Go to ScanPDF
    </a>
</div>
{% endblock %}
