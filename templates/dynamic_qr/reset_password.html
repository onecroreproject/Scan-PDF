{% extends 'dynamic_qr/auth_base.html' %}

{% block title %}Reset Password — Dynamic QR{% endblock %}

{% block body %}
<div class="auth-card">
    <div class="auth-logo">
        <div class="icon-wrap" style="background:linear-gradient(135deg, #22c55e, #06b6d4);">
            <i data-lucide="lock" style="width:28px;height:28px"></i>
        </div>
        <h1>Reset Password</h1>
        <p>Create a new password for your account</p>
    </div>

    {% if error %}
    <div class="error-box">
        <i data-lucide="alert-circle" style="width:18px;height:18px;color:#f87171;flex-shrink:0"></i>
        <p>{{ error }}</p>
    </div>
    {% endif %}

    <form method="POST" action="{% url 'dynamic_qr:reset_password' %}">
        {% csrf_token %}
        <div class="field-group">
            <label class="field-label">New Password</label>
            <div class="password-wrap">
                <input type="password" name="new_password" class="dqr-field" placeholder="Enter new password" required>
                <button type="button" class="toggle-pass"><i data-lucide="eye" style="width:18px;height:18px"></i></button>
            </div>
        </div>
        <div class="field-group">
            <label class="field-label">Confirm New Password</label>
            <div class="password-wrap">
                <input type="password" name="confirm_password" class="dqr-field" placeholder="Confirm new password" required>
                <button type="button" class="toggle-pass"><i data-lucide="eye" style="width:18px;height:18px"></i></button>
            </div>
        </div>
        <button type="submit" class="btn-primary" style="background:linear-gradient(135deg, #22c55e, #06b6d4);">
            <span style="display:flex;align-items:center;justify-content:center;gap:8px">
                <i data-lucide="save" style="width:18px;height:18px"></i>
                Save New Password
            </span>
        </button>
    </form>
</div>
{% endblock %}
