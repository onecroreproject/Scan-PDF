{% extends 'dynamic_qr/auth_base.html' %}

{% block title %}Reset Password — Dynamic QR{% endblock %}

{% block auth_header %}
    <h1>Reset Password</h1>
    <p>Create a strong new password</p>
{% endblock %}

{% block auth_content %}
    {% if error %}
    <div class="error-box">
        <i data-lucide="alert-circle" style="width:16px;height:16px;color:#f87171;flex-shrink:0"></i>
        <p>{{ error }}</p>
    </div>
    {% endif %}

    <form method="POST" action="{% url 'dynamic_qr:reset_password' %}">
        {% csrf_token %}
        <div class="field-group">
            <label class="field-label">New Password</label>
            <div class="password-wrap">
                <input type="password" name="new_password" class="dqr-field" placeholder="••••••••" required>
                <button type="button" class="toggle-pass"><i data-lucide="eye" style="width:18px;height:18px"></i></button>
            </div>
        </div>
        <div class="field-group">
            <label class="field-label">Confirm Password</label>
            <div class="password-wrap">
                <input type="password" name="confirm_password" class="dqr-field" placeholder="••••••••" required>
                <button type="button" class="toggle-pass"><i data-lucide="eye" style="width:18px;height:18px"></i></button>
            </div>
        </div>
        <button type="submit" class="btn-primary">
            Save New Password
        </button>
    </form>
{% endblock %}
