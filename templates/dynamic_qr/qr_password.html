<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Protected Link</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        .card-shadow { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-[32px] p-8 md:p-12 max-w-md w-full border border-slate-100 card-shadow text-center relative overflow-hidden">
        <div class="w-20 h-20 bg-indigo-50 text-indigo-500 rounded-[24px] flex items-center justify-center mx-auto mb-8 relative">
            <i data-lucide="lock" class="w-10 h-10 relative z-10"></i>
        </div>
        
        <h1 class="text-3xl font-black text-slate-900 tracking-tight mb-3">Protected Link</h1>
        <p class="text-slate-500 font-medium mb-8">This Short URL requires a password to access.</p>
        
        {% if error %}
        <div class="bg-red-50 text-red-600 p-4 rounded-xl text-sm font-bold mb-6">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="">
            {% csrf_token %}
            <div class="mb-6 text-left">
                <label class="text-[11px] font-black text-slate-400 uppercase tracking-widest block px-1 mb-2">Enter Password</label>
                <input type="password" name="password" required
                    class="w-full px-5 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none focus:border-indigo-500 focus:bg-white transition-all font-semibold"
                    placeholder="••••••••">
            </div>
            
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl transition-colors shadow-lg shadow-indigo-200">
                Unlock Link
            </button>
        </form>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
