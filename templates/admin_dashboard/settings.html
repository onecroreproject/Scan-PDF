{% extends 'admin_dashboard/base.html' %}

{% block title %}Settings | SaaS Admin{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold m-0">Dashboard Settings</h3>
</div>

<div class="row g-4">
    <div class="col-md-6">
        <div class="card-table p-4">
            <h5 class="fw-bold mb-4">General Settings</h5>
            <form>
                <div class="mb-3">
                    <label class="form-label text-muted fw-bold small text-uppercase">Site Name</label>
                    <input type="text" class="form-control" value="ScanPDF">
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted fw-bold small text-uppercase">Admin Email</label>
                    <input type="email" class="form-control" value="admin@example.com">
                </div>
                <button type="button" class="btn btn-primary">Save Changes</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
