; ═══════════════════════════════════════════════════════════════
; Supervisor configuration for ScanPDF (alternative to systemd)
; Place in /etc/supervisor/conf.d/scanpdf.conf
; ═══════════════════════════════════════════════════════════════

[program:scanpdf-gunicorn]
command=/var/www/scanpdf/venv/bin/gunicorn --access-logfile - --workers 3 --worker-class gthread --threads 2 --worker-tmp-dir /dev/shm --bind unix:/run/scanpdf/gunicorn.sock --timeout 300 allinone.wsgi:application
directory=/var/www/scanpdf
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
environment=DJANGO_SETTINGS_MODULE="allinone.settings",PYTHONUNBUFFERED="1"

[program:scanpdf-celery]
command=/var/www/scanpdf/venv/bin/celery -A allinone worker --loglevel=info --concurrency=2 --prefetch-multiplier=1 --max-tasks-per-child=50 --hostname=scanpdf-worker%%h
directory=/var/www/scanpdf
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=60
killasgroup=true
priority=998
environment=DJANGO_SETTINGS_MODULE="allinone.settings",PYTHONUNBUFFERED="1"

[group:scanpdf]
programs=scanpdf-gunicorn,scanpdf-celery
