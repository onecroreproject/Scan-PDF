# ═══════════════════════════════════════════════════════════════
# ScanPDF — Production Nginx Configuration
# Place in /etc/nginx/sites-available/scanpdf and symlink to sites-enabled
# ═══════════════════════════════════════════════════════════════

upstream scanpdf_app {
    server unix:/run/scanpdf/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name _;  # Replace with your domain

    # Large file uploads for video processing
    client_max_body_size 5G;
    client_body_timeout 600s;
    client_header_timeout 600s;
    proxy_read_timeout 600s;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    send_timeout 600s;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static files
    location /static/ {
        alias /var/www/scanpdf/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media (temp) files — pass through with large limits
    location /media/ {
        alias /tmp/scanpdf_media_root/;
        expires 1h;
        add_header Cache-Control "private, no-store";
    }

    # Favicon
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Proxy to Gunicorn
    location / {
        proxy_pass http://scanpdf_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

